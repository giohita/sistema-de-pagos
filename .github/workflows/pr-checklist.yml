name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-description:
    name: Validate PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR description contains required sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = ['Summary', 'Changes', 'Testing'];
            const missing = required.filter(section =>
              !body.toLowerCase().includes(section.toLowerCase())
            );
            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections: ${missing.join(', ')}`);
            }
